# Push a tag like v1.5.0 to publish a release with a ready-to-load zip.
# Release notes come from .github/release-notes/<tag>.md if it exists.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check manifest version matches tag
        run: |
          manifest="v$(jq -r .version manifest.json)"
          if [ "$manifest" != "$GITHUB_REF_NAME" ]; then
            echo "::error::manifest.json is $manifest but tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build zip
        run: git archive --format=zip --prefix=tabloid/ -o "tabloid-$GITHUB_REF_NAME.zip" HEAD

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$GITHUB_REF_NAME" "tabloid-$GITHUB_REF_NAME.zip" \
            --title "Tabloid $GITHUB_REF_NAME" "$@"
