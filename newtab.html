<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <header class="topbar">
    <div class="heading">
      <div>
        <p id="greeting" class="eyebrow"></p>
        <h1 id="date"></h1>
      </div>
      <div id="weather" class="weather" hidden>
        <span class="wx-icon" aria-hidden="true"></span>
        <span class="wx-temp"></span>
        <span class="wx-meta">
          <span class="wx-range"></span>
          <span class="wx-place"></span>
        </span>
      </div>
    </div>
    <div class="controls">
      <span id="status" class="status">Loading…</span>
      <button id="refresh" class="icon-btn" title="Refresh all feeds (R)" aria-label="Refresh">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <div class="theme-toggle" role="radiogroup" aria-label="Theme">
        <button data-theme-value="light" role="radio" title="Light">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
        <button data-theme-value="auto" role="radio" title="Match system">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        </button>
        <button data-theme-value="dark" role="radio" title="Dark">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main id="columns" class="columns"></main>
  <script src="feeds.js"></script>
  <script src="newtab.js"></script>
  <script src="weather.js"></script>
</body>
</html>
